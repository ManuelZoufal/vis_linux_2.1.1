{% extends "base.html" %}

{% block title %}Logs{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/logs_styles.css') }}">

<div class="logs-section">
    <h2>Logs</h2>
    <button class="button button-primary" onclick="exportLogs()">Logs exportieren</button>
    <table id="logs-table">
        <thead>
            <tr>
                <th>Zeitstempel</th>
                <th>Nachricht</th>
            </tr>
        </thead>
        <tbody>
            <!-- Logs will be populated here -->
        </tbody>
    </table>
</div>

{% if session['role'] == 'Administrator' %}
<div class="thread-section">
    <h2>Thread-Status</h2>
    <button class="button button-primary" onclick="exportThreadStatus()">Thread-Status exportieren</button>
    <p id="thread-summary" class="thread-summary">Lade Thread-Status …</p>
    <p id="certificate-status" class="thread-summary"></p>
    <table id="thread-table">
        <thead>
            <tr>
                <th>Thread</th>
                <th>Status</th>
                <th>Letzter Erfolg</th>
                <th>Durchläufe</th>
                <th>Fehler</th>
                <th>Letzter Fehler</th>
            </tr>
        </thead>
        <tbody>
            <!-- Thread status will be populated here -->
        </tbody>
    </table>
</div>
{% endif %}

<script src="{{ url_for('static', filename='js/logs.js') }}"></script>
{% endblock %}
