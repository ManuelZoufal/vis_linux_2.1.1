{% extends "base.html" %}

{% block title %}Sensoreinstellungen{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/sensor_styles.css') }}">

<div class="sensor-section">
    <h2>Sensoreinstellungen</h2>
    <button class="button button-primary" onclick="openVirtualSensorModal()">Virtuellen Sensor hinzufügen</button>
    <table class="sensor-table" id="sensor-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>IP-Adresse</th>
                <th>Belegung</th>
                <th>Zählung</th>
                <th>Gruppen-ID</th>
                <th>Sensortyp</th>
                <th>Datenpunkt_ID</th>
                <th>Aktionen</th>
            </tr>
        </thead>
        <tbody id="sensor-list">
            <!-- Sensor rows will be populated here -->
        </tbody>
    </table>
</div>

<!-- Sensor Modal -->
<div id="sensorModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('sensorModal')">&times;</span>
        <h2 id="sensorModalTitle">Sensor Einstellungen</h2>
        <form id="sensorForm" class="modal-form">
            <!-- Form fields will be populated here -->
        </form>
        <button class="button button-primary" onclick="saveSensorSettings()">Speichern</button>
    </div>
</div>

<!-- Virtual Sensor Modal -->
<div id="virtualSensorModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('virtualSensorModal')">&times;</span>
        <h2 id="virtualSensorModalTitle">Virtuellen Sensor hinzufügen</h2>
        <form id="virtualSensorForm" class="modal-form">
            <div class="form-group">
                <label for="virtualSensorName">Name</label>
                <input type="text" id="virtualSensorName" name="name" required>
            </div>
            <div class="form-group">
                <label for="virtualSensorGroup">Gruppe</label>
                <select id="virtualSensorGroup" name="group_id" required></select>
            </div>
            <div class="form-group">
                <label for="virtualSensorOccupancy">Belegung</label>
                <input type="number" id="virtualSensorOccupancy" name="occupancy" required>
            </div>
        </form>
        <button class="button button-primary" onclick="saveVirtualSensor()">Speichern</button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/sensor_settings.js') }}"></script>
{% endblock %}
